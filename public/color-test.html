<!DOCTYPE html><html><body><img id="img" src="/images/Logo of M G Schools_Solo.jpg.jpeg" crossorigin="anonymous" onload="processImage()"/><script>function processImage() { const img = document.getElementById("img"); const canvas = document.createElement("canvas"); canvas.width = img.width; canvas.height = img.height; const ctx = canvas.getContext("2d"); ctx.drawImage(img, 0, 0, img.width, img.height); const data = ctx.getImageData(0, 0, img.width, img.height).data; const colors = {}; for (let i = 0; i < data.length; i += 4) { const r = data[i]; const g = data[i+1]; const b = data[i+2]; const a = data[i+3]; if (a < 128 || (r > 240 && g > 240 && b > 240) || (r < 15 && g < 15 && b < 15)) continue; const key = r + "," + g + "," + b; colors[key] = (colors[key] || 0) + 1; } const sorted = Object.entries(colors).sort((a,b) => b[1] - a[1]).slice(0, 5); console.log("DOMINANT_COLORS:", JSON.stringify(sorted)); document.body.innerHTML += "<div id=\"result\">" + JSON.stringify(sorted) + "</div>"; }</script></body></html>
